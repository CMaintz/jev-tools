name: security
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  security:
    uses: CMaintz/foundry/.github/workflows/security.yml@39652ac005e6800cd026e77ddc65a2b9d7d61895 # v2.12.0
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    with:
      # Gate-defining files: changing these alongside source needs the ruleset-change label.
      ruleset_paths: '^(eslint\.config\.(js|mjs|cjs)|eslint\.config\.foundry\.mjs|mise\.toml|vitest\.config\.ts|tsconfig\.base\.json|\.gitleaks\.toml|\.github/workflows/|scripts/ruleset_guard\.py)'
      source_paths: '^packages/[^/]+/src/'
      test_paths: '\.test\.ts$'
