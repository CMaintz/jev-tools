name: security
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
# Grant what the reusable workflows request at the job level (tier0 needs
# pull-requests: read for gitleaks/ruleset-guard).
permissions:
  contents: read
  pull-requests: read
jobs:
  tier0:
    # CMaintz/foundry v1.2.0: gitleaks secret scan + ruleset guard (scripts/ruleset_guard.py)
    uses: CMaintz/foundry/.github/workflows/tier0.yml@a1be93192170aaabb0f67f048eb5b7e2bcfaf2da # v1.2.0
    with:
      source_paths: '^packages/[^/]+/src/'
      ruleset_paths: '^(eslint\.config\.(js|mjs|cjs)|eslint\.config\.foundry\.mjs|mise\.toml|vitest\.config\.ts|tsconfig\.base\.json|\.github/workflows/)'
  sast:
    uses: CMaintz/foundry/.github/workflows/semgrep.yml@a1be93192170aaabb0f67f048eb5b7e2bcfaf2da # v1.2.0
