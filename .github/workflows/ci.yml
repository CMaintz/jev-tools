name: ci
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  gate:
    name: Gate (lint, typecheck, test, audit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: '2026.9.2'
      - run: npm ci
      - name: 'gate: lint'
        run: mise run lint
      - name: 'gate: typecheck'
        run: mise run typecheck
      - name: 'gate: test (coverage floor)'
        run: mise run test
      - name: 'gate: audit'
        run: mise run audit
      - name: Build all packages
        run: npm run build
      - name: Action bundle is up to date
        run: |
          if ! git diff --quiet -- packages/triage/dist; then
            echo "::error::packages/triage/dist is stale. Run 'npm run build' and commit packages/triage/dist."
            git diff --stat -- packages/triage/dist
            exit 1
          fi
